name: windows-build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - run: nuget restore BookMaster.sln
      - run: msbuild BookMaster/BookMaster.csproj /p:Configuration=Release /m
